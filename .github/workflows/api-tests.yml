name: Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Newman
      - name: Install Newman
        run: |
          npm install -g newman

      # 4. Install HTML reporter
      - name: Install Newman HTML Extra Reporter
        run: |
          npm install -g newman-reporter-htmlextra

      # 5. Create reports directory
      - name: Create Reports Directory
        run: |
          mkdir -p reports

      # 6. Run Postman Collection
      - name: Run Postman API Tests
        run: |
          newman run collections/FakeStoreAPI-Products.postman_collection.json \
            -e environments/FakeStore-Environment.postman_environment.json \
            --reporter-htmlextra-export reports/api-test-report.html \
            --reporter-json-export reports/api-test-report.json \
            --reporter-junit-export reports/api-test-report.xml \
            > reports/api-test-report.txt

      # 7. Upload test reports
      - name: Upload API Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-reports
          path: reports/
