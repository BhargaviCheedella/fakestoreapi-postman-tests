name: Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman API Tests
        run: |
          mkdir -p reports
          newman run collections/FakeStoreAPI-Products_postman_collection.json \
            -e environments/FakeStore.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export reports/newman-results.xml