name: Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
  workflow_dispatch: 
jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Install HTML Extra Reporter
        run: npm install -g newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Postman Collection
        run: |
          newman run "collections/FakeStoreAPI-Products_postman_collection.json" \
            -e "environments/FakeStore.postman_environment.json" \
            -r cli,json,htmlextra \
            --reporter-json-export "reports/newman-report.json" \
            --reporter-htmlextra-export "reports/newman-report.html" \
            > "reports/newman-report.txt"
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-reports
          path: reports/
