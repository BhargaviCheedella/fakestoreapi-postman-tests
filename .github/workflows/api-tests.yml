name: Postman API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  api-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Install HTML Extra Reporter
        run: npm install -g newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Newman Tests
        run: |
          newman run collections/FakeStoreAPI-Products_postman_collection.json \
            -e environments/FakeStore.postman_environment.json \
            --reporters cli,htmlextra,json,junit \
            --reporter-htmlextra-export reports/api-test-report.html \
            --reporter-json-export reports/api-test-report.json \
            --reporter-junit-export reports/api-test-report.xml \
            > reports/api-test-report.txt
      - name: Check files
        run: |
          echo "Repository files:"
          find. -type f | sort
          
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-reports
          path: reports/
